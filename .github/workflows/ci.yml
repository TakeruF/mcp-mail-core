name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - run: npm audit --omit=dev
      - name: Build versioned package artifact
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          sha256sum artifacts/*.tgz > artifacts/SHA256SUMS
      - name: Upload versioned package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp-mail-core-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Check committed and generated diffs
        run: |
          git diff-tree --check -r --root HEAD
          git diff --check
          git diff --exit-code

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
